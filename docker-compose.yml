# Frontend Deployment - KP-Penelitian-Dosen (Web UI)
# Production deployment with MySQL and Nginx reverse proxy

services:
  mysql:
    image: mysql:8.0
    container_name: frontend_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: kp_penelitian_dosen
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - frontend_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-kp-frontend:latest}
    container_name: frontend_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Database connection
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: kp_penelitian_dosen
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      # App config
      APP_NAME: ${APP_NAME:-SINTA Research Visualizer}
      BASE_URL: ${BASE_URL}
      # Backend API connection
      API_URL: ${API_URL}
      API_KEY: ${API_KEY}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    networks:
      - frontend_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: frontend_nginx
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend_network

volumes:
  mysql_data:

networks:
  frontend_network:
    driver: bridge